<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Kanto Descent — a FireRed × Hades roguelike</title>
<link rel="icon" href="data:,">
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  html, body { margin: 0; height: 100%; background: #050608; overflow: hidden; }
  body { display: flex; align-items: center; justify-content: center; }
  canvas { image-rendering: pixelated; image-rendering: crisp-edges; display: block; outline: none; cursor: crosshair; }
  #loading { position: absolute; color: #ddd; font: 14px monospace; }
  #signin { display: none; flex-direction: column; align-items: center; gap: 14px; color: #e8e8f0; font: 15px monospace; text-align: center; max-width: 440px; }
  #signin h1 { margin: 0; font-size: 34px; color: #f8d030; text-shadow: 3px 3px 0 #702000; letter-spacing: 2px; }
  #signin p { margin: 0; color: #b8b8c8; line-height: 1.5; }
  #signin button { font: 16px monospace; padding: 10px 18px; border: 0; border-radius: 6px; cursor: pointer; background: #f8f8f8; color: #202020; }
  #signin #signin-out { display: none; background: #303848; color: #e8e8f0; }
  #signin-error { color: #ff8080; min-height: 1.2em; }
</style>
</head>
<body>
<div id="loading">Loading Kanto Descent...</div>
<canvas id="game" tabindex="0"></canvas>
<div id="signin">
  <h1>KANTO DESCENT</h1>
  <p>a FireRed x Hades roguelike</p>
  <p id="signin-msg">This is a private playtest. Sign in with Google to play (you need an invite).</p>
  <button id="signin-btn">Sign in with Google</button>
  <button id="signin-out">Sign out</button>
  <p id="signin-error"></p>
</div>
<script type="module" src="src/main.js"></script>
</body>
</html>
